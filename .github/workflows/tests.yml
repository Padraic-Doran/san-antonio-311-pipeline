name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sa311_test
          POSTGRES_USER: sa311
          POSTGRES_PASSWORD: sa311_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sa311 -d sa311_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://sa311:sa311_test@localhost:5432/sa311_test
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: coverage run -m pytest && coverage report

      - name: Validate notebook JSON
        run: python -m json.tool notebooks/01_explore_311_data.ipynb >/dev/null
