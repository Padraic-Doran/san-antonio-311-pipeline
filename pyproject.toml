[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "san-antonio-311-pipeline"
version = "0.1.0"
description = "A data pipeline for City of San Antonio 311 service-request data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.3",
]

[project.scripts]
sa311-ingest = "san_antonio_311.ingest:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]
notebook = [
  "jupyterlab>=4",
  "matplotlib>=3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
