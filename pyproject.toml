[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "san-antonio-311-pipeline"
version = "0.1.0"
description = "A data pipeline for City of San Antonio 311 service-request data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.3",
  "psycopg[binary]>=3.2",
]

[project.scripts]
sa311-ingest = "san_antonio_311.ingest:main"
sa311-load = "san_antonio_311.database:main"
sa311-transform = "san_antonio_311.transform:main"

[project.optional-dependencies]
dev = [
  "coverage>=7.10",
  "pytest>=8",
  "ruff>=0.12",
]
notebook = [
  "jupyterlab>=4",
  "matplotlib>=3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["san_antonio_311"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
san_antonio_311 = ["sql/*.sql"]
