services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sa311
      POSTGRES_USER: sa311
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sa311_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa311 -d sa311"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
